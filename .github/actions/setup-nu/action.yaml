name: Set up Nushell
description: Install the Nushell version that nix/appimage.nix pins.

runs:
  using: composite
  steps:
    - name: Read the version
      id: version
      shell: bash
      run: echo "name=$(sed -n 's/^ *nuVersion = "\(.*\)";/\1/p' nix/appimage.nix)" >> "$GITHUB_OUTPUT"

    - name: Install Nushell
      uses: hustcer/setup-nu@v3
      with:
        version: ${{ steps.version.outputs.name }}
