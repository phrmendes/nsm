name: release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: nu {0}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.116.1'

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Use the devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add 'nixpkgs#devenv'

      - name: Run the hooks and the tests
        run: devenv test

  release:
    name: Release
    needs: check
    if: github.event_name != 'pull_request' && !startsWith(github.event.head_commit.message || '', 'bump:')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code and its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.116.1'

      - name: Bump the version and tag it
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the new tag
        id: tag
        run: |
          let tag = git tag --points-at HEAD | lines | where {|line| $line =~ '^v[0-9]' } | get --optional 0 | default ''
          $"name=($tag)(char nl)" | save --append $env.GITHUB_OUTPUT

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        if: steps.tag.outputs.name != ''

      - name: Build the AppImage
        id: build
        if: steps.tag.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          let existing = (gh release view $env.TAG | complete)
          if $existing.exit_code == 0 {
            print 'The release already exists.'
            exit 0
          }

          nix build '.#nsm-appimage'
          ^cp -L result nsm-x86_64.AppImage
          ^chmod +w nsm-x86_64.AppImage
          ^sha256sum nsm-x86_64.AppImage | save --force nsm-x86_64.AppImage.sha256

          let smoke = (with-env {APPIMAGE_EXTRACT_AND_RUN: '1'} { ^./nsm-x86_64.AppImage | complete })
          if not ($smoke.stdout | str contains 'switch') {
            error make { msg: 'The AppImage does not list switch.' }
          }

          $"publish=true(char nl)" | save --append $env.GITHUB_OUTPUT

      - name: Publish the release
        if: steps.tag.outputs.name != '' && steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          let version = ($env.TAG | str replace --regex '^v' '')
          let line = $"VERSION=($version)"

          open --raw scripts/install.sh
          | str replace --regex '(?m)^VERSION=latest$' $line
          | save --force install.sh

          let stamped = (open --raw install.sh | lines | where {|text| $text == $line } | is-not-empty)
          if not $stamped {
            error make { msg: 'The installer does not carry the version.' }
          }

          let notes = (
            open --raw CHANGELOG.md
            | split row --regex '(?m)^## '
            | where {|section| $section | str starts-with $"($env.TAG) " }
            | get --optional 0
            | default ''
            | lines
            | skip 1
            | str join (char nl)
            | str trim
          )
          if ($notes | is-empty) {
            error make { msg: 'The changelog has no section for the tag.' }
          }
          $notes | save --force notes.md

          gh release create $env.TAG --verify-tag --title $env.TAG --notes-file notes.md nsm-x86_64.AppImage nsm-x86_64.AppImage.sha256 install.sh
