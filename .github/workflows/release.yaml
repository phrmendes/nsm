name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Build the AppImage
        run: |
          nix build .#nsm-appimage
          cp -L result nsm-x86_64.AppImage
          chmod +w nsm-x86_64.AppImage
          sha256sum nsm-x86_64.AppImage > nsm-x86_64.AppImage.sha256

      - name: Smoke test the AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./nsm-x86_64.AppImage | grep -q switch

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            nsm-x86_64.AppImage \
            nsm-x86_64.AppImage.sha256 \
            scripts/install.sh
