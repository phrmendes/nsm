name: release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  NU_VERSION: "0.116.1"

defaults:
  run:
    shell: nu {0}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: ${{ env.NU_VERSION }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Use the devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add 'nixpkgs#devenv'

      - name: Run the hooks and the tests
        run: devenv test

  release:
    name: Release
    needs: check
    if: github.event_name != 'pull_request' && !startsWith(github.event.head_commit.message || '', 'bump:')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code and its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: ${{ env.NU_VERSION }}

      - name: Bump the version and tag it
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the new tag
        id: tag
        run: nu .github/workflows/scripts/read-tag.nu

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        if: steps.tag.outputs.name != ''

      - name: Build the AppImage
        id: build
        if: steps.tag.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: nu .github/workflows/scripts/build.nu

      - name: Publish the release
        if: steps.tag.outputs.name != '' && steps.build.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: nu .github/workflows/scripts/publish.nu
