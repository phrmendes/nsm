name: release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: nu {0}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Use the devenv cache
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add 'nixpkgs#devenv'

      - name: Run the hooks and the tests
        run: devenv test

  release:
    name: Release
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Check out the code and its history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Bump the version and tag it
        id: tag
        run: nu .github/workflows/scripts/release.nu

  publish:
    name: Publish
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Nushell
        uses: ./.github/actions/setup-nu

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: nu .github/workflows/scripts/publish.nu
