[rules]
# A pipe to `ignore` waits for the detached Neovim server to close the pipe, so the call redirects to /dev/null.
ignore_over_dev_null = "off"
# The error of an external command stops the script, and a `try` that only repeats it adds noise.
unhandled_external_error = "off"
# The test runner runs each test in its own Nushell, so that one test cannot change the state of another.
redundant_nu_subprocess = "off"
# The test commands run by name from `run-tests`, so static reachability cannot see them.
unused_helper_functions = "off"
# The CLI reports a failure by printing it and exiting; the exit stays in the reporter.
exit_only_in_main = "off"
# Test helpers take the three paths they need; an options record reads worse there.
max_positional_params = "off"
